name: bump all submodule to latest commit

on:
   workflow_dispatch:

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0
          submodules: true
      - uses: sgoudham/update-git-submodules@master
      - uses: stefanzweifel/git-auto-commit-action@master
        with:
          commit_message: Bump all Submodule to latest commit
          
