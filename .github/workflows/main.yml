name: Upstream

on: workflow_dispatch
jobs:
  upstream:
   runs-on: ubuntu-latest
   steps:
     - name: checkout
       uses: actions/checkout@main
       with:
         fetch-depth: 0
         submodules: true
     - name: Setup Git user
       uses: fregante/setup-git-user@v2.0.2
     - run: git fetch
     - run: git merge --strategy-option theirs
       
  
